{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "opensearch.secretName" . }}
{{- $passwordKey := .Values.auth.secretKeys.adminPassword }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preserveAdminPassword := and (not .Values.auth.adminPassword) $existing (hasKey $existing.data $passwordKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "opensearch.labels" . | nindent 4 }}
type: Opaque
{{- if $preserveAdminPassword }}
data:
  {{ $passwordKey }}: {{ index $existing.data $passwordKey }}
{{- end }}
stringData:
  {{- if .Values.auth.adminPassword }}
  {{ $passwordKey }}: {{ .Values.auth.adminPassword | quote }}
  {{- else if not $preserveAdminPassword }}
  {{ $passwordKey }}: {{ printf "%sA1!" (randAlphaNum 29) | quote }}
  {{- end }}
{{- end }}
