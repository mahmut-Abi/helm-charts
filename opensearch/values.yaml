# Number of OpenSearch nodes when cluster.enabled is false.
replicaCount: 1

image:
  # Official OpenSearch image.
  repository: opensearchproject/opensearch
  tag: "2.19.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

auth:
  # OpenSearch 2.12+ refuses weak initial admin passwords during demo security setup.
  # Leave empty to generate a strong password on first install and reuse it on upgrade.
  adminUsername: admin
  adminPassword: ""
  # Set this to use a pre-created Secret instead of rendering secret.yaml.
  # The Secret must contain keys matching secretKeys below.
  existingSecret: ""
  secretKeys:
    adminPassword: OPENSEARCH_INITIAL_ADMIN_PASSWORD

opensearch:
  clusterName: opensearch
  networkHost: 0.0.0.0
  nodeRoles:
    - cluster_manager
    - data
    - ingest
  extraEnvs: []

service:
  # ClusterIP exposes OpenSearch inside the cluster. Use NodePort/LoadBalancer
  # when external access is needed.
  type: ClusterIP
  httpPort: 9200
  transportPort: 9300
  annotations: {}

serviceMonitor:
  # Enable ServiceMonitor for Prometheus Operator auto-discovery.
  enabled: false
  labels: {}
  endpoints:
    - port: http
      interval: 30s
      path: /metrics

headlessService:
  annotations: {}
  publishNotReadyAddresses: true

cluster:
  # Enable OpenSearch cluster mode. When enabled, discovery.seed_hosts is
  # configured automatically using the headless service.
  enabled: false
  # Number of nodes in the cluster. An odd number (3, 5, ...) is recommended
  # for split-brain protection.
  replicas: 3
  clusterDomain: cluster.local
  # Restrict initial cluster-manager bootstrap nodes. Leave empty to use all replicas.
  initialClusterManagerNodes: []

# OpenSearch security plugin configuration.
security:
  # Disable the security plugin entirely. When disabled, TLS and
  # authentication are turned off. Only use for development.
  disabled: false
  # When true, the demo certificates bundled with the OpenSearch image are
  # used for inter-node TLS. Not suitable for production.
  useDemoCerts: true
  tls:
    # Required when security is enabled and useDemoCerts is false.
    existingSecret: ""
    mountPath: /usr/share/opensearch/config/certs
    certFile: tls.crt
    keyFile: tls.key
    caFile: ca.crt
    adminDn: []
    nodesDn: []

persistence:
  enabled: true
  # Use null to accept the cluster default StorageClass. Set "-" to disable
  # dynamic provisioning with storageClassName: "".
  storageClass: null
  accessModes:
    - ReadWriteOnce
  size: 30Gi
  annotations: {}

# StatefulSet persistentVolumeClaimRetentionPolicy. Requires Kubernetes >= 1.23.
# Only applied when both persistence.enabled and this block's enabled are true.
persistentVolumeClaimRetentionPolicy:
  enabled: false
  whenDeleted: Retain
  whenScaled: Retain

resources:
  requests:
    cpu: 1
    memory: 2Gi
  limits:
    cpu: 4
    memory: 8Gi

# JVM heap size. Defaults to half of the memory limit. Set explicitly to
# override, e.g. "-Xms2g -Xmx2g".
javaOpts: ""

sysctlInit:
  # Enable only when your cluster policy allows privileged init containers.
  enabled: false
  maxMapCount: 262144

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

podLabels: {}

priorityClassName: ""

topologySpreadConstraints: []

terminationGracePeriodSeconds: 120

pdb:
  enabled: true
  maxUnavailable: 1

startupProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

readinessProbe:
  enabled: true
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

# Leave empty to use OrderedReady for single-node mode and Parallel for
# cluster mode. Set explicitly to OrderedReady or Parallel to override.
podManagementPolicy: ""

extraInitContainers: []

extraVolumes: []

extraVolumeMounts: []

# NetworkPolicy to restrict ingress/egress traffic to the OpenSearch pods.
# When enabled, the default ingress rule allows all traffic to simplify
# initial setup. Set explicit ingress/egress rules in production.
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress:
    - {}
  egress: []

# Ingress (standard Kubernetes Ingress) for the HTTP REST API.
ingress:
  enabled: false
  className: nginx
  hostname: ""
  additionalHostNames: []
  labels: {}
  annotations: {}
  tls: []

# Gateway API (HTTPRoute) for the HTTP REST API. Mutually exclusive with ingress.
gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  hostname: ""
  labels: {}
  annotations: {}
