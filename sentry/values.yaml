image:
  sentry:
    repository: ghcr.io/getsentry/sentry
    tag: "26.5.0"
    pullPolicy: IfNotPresent
  relay:
    repository: ghcr.io/getsentry/relay
    tag: "26.5.0"
    pullPolicy: IfNotPresent
  snuba:
    repository: ghcr.io/getsentry/snuba
    tag: "26.5.0"
    pullPolicy: IfNotPresent
  taskbroker:
    repository: ghcr.io/getsentry/taskbroker
    tag: "26.5.0"
    pullPolicy: IfNotPresent
  # Kafka image used by the topic-creation init container.
  kafka:
    repository: apache/kafka
    tag: "3.9.0"
    pullPolicy: IfNotPresent
  # Busybox image used by the relay init container.
  busybox:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  # Postgres image used by upgrade job init container.
  postgres:
    repository: postgres
    tag: "16.3"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress:
    - {}
  egress: []

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# Sentry secret key. Required. Auto-generated if not set.
auth:
  # SENTRY_SECRET_KEY for Django. Auto-generated if not set.
  secretKey: ""
  # Set this to use a pre-created Secret instead of rendering secret.yaml.
  existingSecret: ""

config:
  # Extra Python appended to sentry.conf.py for site-specific Sentry settings.
  extraPython: ""

# Admin user configuration. Used to create the initial superuser.
user:
  email: admin@sentry.local
  # password: "" -- must be set to create the admin user
  password: ""

# PostgreSQL connection. Point to an existing PostgreSQL instance.
postgres:
  host: ""
  port: 5432
  database: sentry
  user: postgres
  password: ""
  existingSecret: ""
  existingSecretKey: ""

# Redis connection. Point to an existing Redis instance.
redis:
  host: ""
  port: 6379
  password: ""
  existingSecret: ""
  existingSecretKey: ""

# Kafka connection. Point to an existing Kafka cluster.
kafka:
  bootstrapServers: ""
  # Auto-create Kafka topics before snuba-consumer starts.
  autoCreateTopics: true
  # Kafka topics used by relay, sentry consumers, and snuba.
  topics:
    - ingest-events
    - events
    - group-attributes
    - outcomes
  topicCreation:
    partitions: 3
    replicationFactor: 1

# ClickHouse connection for Snuba. Point to an existing ClickHouse instance.
clickhouse:
  host: ""
  httpPort: 8123
  tcpPort: 9000
  database: default
  user: default
  password: ""
  existingSecret: ""
  existingSecretKey: ""
  # The companion ClickHouse chart defaults to standalone mode. Set false when
  # using a replicated ClickHouse cluster.
  singleNode: true
  # ClickHouse cluster name used for CREATE DATABASE ... ON CLUSTER when singleNode=false.
  clusterName: default

# Filestore for uploaded files (artifacts, release files).
filestore:
  backend: filesystem  # filesystem, s3, or gcs
  filesystem:
    path: /var/lib/sentry/files
    persistence:
      enabled: true
      size: 10Gi
      accessMode: ReadWriteMany
      storageClass: ""
      existingClaim: ""
      annotations: {}
  s3:
    accessKey: ""
    secretKey: ""
    bucketName: ""
    endpointUrl: ""
    region: us-east-1
    existingSecret: ""
    existingSecretAccessKeyKey: ""
    existingSecretSecretKeyKey: ""

# Sentry Web (Django + React frontend).
web:
  enabled: true
  image:
    repository: ""
    tag: ""
  replicas: 2
  port: 9000
  workers: 8
  threads: 4
  httpKeepalive: 15
  harakiri: 25
  maxRequests: 100000
  maxRequestsDelta: 500
  maxWorkerLifetime: 86400
  bufferSize: 32768
  limitPost: 209715200
  reloadOnRss: 600
  startupProbe:
    enabled: true
    path: /_health/
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readinessProbe:
    enabled: true
    path: /_health/
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  livenessProbe:
    enabled: true
    path: /_health/
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 6
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 4
      memory: 4Gi
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Sentry Worker (Celery worker for async task processing).
worker:
  enabled: true
  image:
    repository: ""
    tag: ""
  replicas: 2
  concurrency: 4
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Sentry Cron (Celery beat for scheduled tasks). Only 1 replica.
cron:
  enabled: true
  replicas: 1
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Relay (event ingestion proxy — receives events from Sentry SDKs).
relay:
  enabled: true
  image:
    repository: ""
    tag: ""
  replicas: 2
  port: 3000
  kafkaMessageMaxBytes: 50000000
  # Maximum concurrent upstream queries when fetching project state.
  # Relay's internal default is 5 — raising this lets more projects
  # fetch state simultaneously after a relay restart.
  maxConcurrentQueries: 10
  # Upstream request timeout in seconds. Lower values help prevent
  # request pileup when the upstream (sentry-web) is under load.
  queryTimeout: 30
  # How long relay caches fetched project state in memory (seconds).
  projectExpiry: 300
  # Grace period before expired project state is removed (seconds).
  projectGracePeriod: 60
  # How long negative lookups (project not found) are cached (seconds).
  missExpiry: 60
  redis:
    # Enable relay-side Redis caching so project state survives relay
    # restarts. Without this, every relay restart triggers a full re-fetch
    # of all project state from sentry-web, which compounds the backlog.
    enabled: false
    host: ""
    port: 6379
    password: ""
  waitForWeb:
    enabled: true
    path: /_health/
    timeoutSeconds: 3
    sleepSeconds: 5
    retries: 120
  startupProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readinessProbe:
    enabled: true
    path: /api/relay/healthcheck/ready/
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  livenessProbe:
    enabled: true
    path: /api/relay/healthcheck/live/
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 6
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Snuba (ClickHouse query service for event search and aggregation).
snuba:
  image:
    repository: ""
    tag: ""
  api:
    enabled: true
    replicas: 2
    port: 1218
    podSecurityContext:
      fsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    startupProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 6
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi
    podAnnotations: {}
    podLabels: {}
    priorityClassName: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}
    extraEnv: []
  consumer:
    enabled: true
    replicas: 2
    podSecurityContext:
      fsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi
    podAnnotations: {}
    podLabels: {}
    priorityClassName: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}
    extraEnv: []

# System settings.
system:
  # Public URL of the Sentry instance (used for links in emails, etc.).
  url: "http://localhost:9000"
  # Admin email for system notifications.
  adminEmail: "admin@localhost"

service:
  type: ClusterIP
  port: 9000
  annotations: {}

serviceMonitor:
  enabled: false
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  endpoints:
    - port: http
      path: /metrics

pdb:
  enabled: false
  minAvailable: 1

# Ingress (standard Kubernetes Ingress). Mutually exclusive with gateway.
ingress:
  enabled: false
  className: nginx
  hostname: ""
  # Additional hostnames to include in the same Ingress.
  additionalHostNames: []
  # Extra labels on the Ingress resource.
  labels: {}
  # Annotations passed to the Ingress. Defaults are tuned for nginx.
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  tls: []
  #  - secretName: sentry-tls
  #    hosts:
  #      - sentry.example.com

# Gateway API (HTTPRoute). Mutually exclusive with ingress.
gateway:
  enabled: false
  # The Gateway name to attach HTTPRoutes to.
  gatewayName: ""
  # Gateway namespace. Defaults to the release namespace.
  gatewayNamespace: ""
  hostname: ""

# Taskbroker (gRPC task broker for taskworker).
taskbroker:
  enabled: true
  replicas: 1
  kafkaTopic: taskworker
  kafkaLongTopic: taskworker-long
  kafkaDeadletterTopic: taskworker-dlq
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""
    existingClaim: ""
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  volumePermissions:
    enabled: true
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - CHOWN
          - FOWNER
      seccompProfile:
        type: RuntimeDefault
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Ingest consumer — reads from ingest-events Kafka topic, processes events into PostgreSQL.
ingestConsumer:
  enabled: true
  replicas: 1
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Upgrade job for migrations and DB setup.
upgrade:
  enabled: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  priorityClassName: ""
