{{- if eq (include "sentry.renderGeneratedSecret" .) "true" }}
{{- $secretName := include "sentry.credentialsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preserveSecretKey := and (not .Values.auth.existingSecret) $existing (hasKey $existing.data "SENTRY_SECRET_KEY") }}
{{- $hasStringData := or (and (not .Values.auth.existingSecret) (not $preserveSecretKey)) .Values.postgres.password .Values.redis.password .Values.clickhouse.password .Values.user.password .Values.filestore.s3.accessKey .Values.filestore.s3.secretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
type: Opaque
{{- if $preserveSecretKey }}
data:
  SENTRY_SECRET_KEY: {{ index $existing.data "SENTRY_SECRET_KEY" }}
{{- end }}
{{- if $hasStringData }}
stringData:
  {{- if and (not .Values.auth.existingSecret) (not $preserveSecretKey) }}
  SENTRY_SECRET_KEY: {{ .Values.auth.secretKey | default (randAlphaNum 64) | quote }}
  {{- end }}
  {{- if .Values.postgres.password }}
  SENTRY_DB_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.redis.password }}
  SENTRY_REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  {{- end }}
  {{- if .Values.clickhouse.password }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  {{- end }}
  {{- if .Values.user.password }}
  SENTRY_ADMIN_PASSWORD: {{ .Values.user.password | quote }}
  {{- end }}
  {{- if .Values.filestore.s3.accessKey }}
  SENTRY_FILESTORE_S3_ACCESS_KEY: {{ .Values.filestore.s3.accessKey | quote }}
  {{- end }}
  {{- if .Values.filestore.s3.secretKey }}
  SENTRY_FILESTORE_S3_SECRET_KEY: {{ .Values.filestore.s3.secretKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
