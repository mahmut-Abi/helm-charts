# CronJob to periodically rebuild project configs so relay always
# has fresh state and doesn't get stuck in deadline exceeded cycles.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sentry.fullname" . }}-projectconfig-rebuild
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          containers:
            - name: rebuild
              image: {{ include "sentry.webImage" . }}
              imagePullPolicy: {{ .Values.image.sentry.pullPolicy }}
              command:
                - sentry
                - shell
                - -c
                - |
                  from sentry.relay.projectconfig_cache import set_many
                  from sentry.models.projectkey import ProjectKey
                  from sentry.relay.config import get_project_config
                  from django.core.cache import cache
                  configs = {}
                  for pk in ProjectKey.objects.all():
                      config = get_project_config(pk.project, project_keys=[pk])
                      configs[pk.public_key] = config.to_dict()
                  set_many(configs)
                  for key, val in configs.items():
                      cache.set(key, val, timeout=86400)
                  print(f"Rebuilt {len(configs)} project configs")
              env:
                - name: SENTRY_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sentry.secretName" . }}
                      key: SENTRY_SECRET_KEY
                - name: SENTRY_DB_NAME
                  value: {{ .Values.postgres.database | quote }}
                - name: SENTRY_DB_USER
                  value: {{ .Values.postgres.user | quote }}
                - name: SENTRY_DB_PASSWORD
                  value: {{ .Values.postgres.password | quote }}
                - name: SENTRY_POSTGRES_HOST
                  value: {{ .Values.postgres.host | quote }}
                - name: SENTRY_POSTGRES_PORT
                  value: {{ .Values.postgres.port | quote }}
                - name: SENTRY_REDIS_HOST
                  value: {{ .Values.redis.host | quote }}
                - name: SENTRY_REDIS_PORT
                  value: {{ .Values.redis.port | quote }}
                - name: SENTRY_REDIS_PASSWORD
                  value: {{ .Values.redis.password | quote }}
                - name: KAFKA_BOOTSTRAP_SERVERS
                  value: {{ .Values.kafka.bootstrapServers | quote }}
                - name: SENTRY_RELAY_HOST
                  value: "relay"
                - name: SENTRY_RELAY_PORT
                  value: "3000"
              volumeMounts:
                - name: config
                  mountPath: /etc/sentry
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: {{ include "sentry.fullname" . }}-sentry
