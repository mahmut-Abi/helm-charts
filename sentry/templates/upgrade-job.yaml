{{- if .Values.upgrade.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sentry.fullname" . }}-upgrade-{{ .Release.Revision }}
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.upgrade.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.upgrade.ttlSecondsAfterFinished }}
  template:
    spec:
      serviceAccountName: {{ include "sentry.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.upgrade.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.upgrade.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      initContainers:
        - name: create-db
          image: "{{ .Values.image.postgres.repository }}:{{ .Values.image.postgres.tag }}"
          imagePullPolicy: {{ .Values.image.postgres.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGPASSWORD
              {{- include "sentry.postgresPasswordEnvValue" . | nindent 14 }}
          command:
            - /bin/bash
            - -c
            - |
              echo "SELECT 'CREATE DATABASE {{ .Values.postgres.database }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .Values.postgres.database }}')\gexec" | psql
        - name: create-clickhouse-db
          image: {{ include "sentry.snubaImage" . }}
          imagePullPolicy: {{ .Values.image.snuba.pullPolicy }}
          command:
            - python
            - -c
            - |
              from clickhouse_driver import Client
              from clickhouse_driver.errors import ServerException
              import os
              import sys

              c = Client(
                  host="{{ .Values.clickhouse.host }}",
                  port={{ .Values.clickhouse.tcpPort }},
                  user="{{ .Values.clickhouse.user }}",
                  password=os.environ.get("CLICKHOUSE_PASSWORD", ""),
              )
              db = "{{ .Values.clickhouse.database }}"
              cluster = "{{ default "default" .Values.clickhouse.clusterName }}"

              try:
                  if "{{ .Values.clickhouse.singleNode }}" == "false":
                      c.execute(f"CREATE DATABASE IF NOT EXISTS {db} ON CLUSTER '{cluster}'")
                      print(f"Database '{db}' created on cluster '{cluster}'")
                  else:
                      c.execute(f"CREATE DATABASE IF NOT EXISTS {db}")
                      print(f"Database '{db}' created (standalone)")
              except ServerException:
                  c.execute(f"CREATE DATABASE IF NOT EXISTS {db}")
                  print(f"Database '{db}' created (standalone)")

              result = c.execute(f"SELECT 1 FROM system.databases WHERE name = '{db}'")
              if not result:
                  print(f"ERROR: Failed to create database '{db}'. Check that ClickHouse user '{{ .Values.clickhouse.user }}' has CREATE DATABASE permission.", file=sys.stderr)
                  sys.exit(1)
              print(f"Database '{db}' ready")
          env:
            - name: CLICKHOUSE_PASSWORD
              {{- include "sentry.clickhousePasswordEnvValue" . | nindent 14 }}
      containers:
        - name: upgrade
          image: {{ include "sentry.webImage" . }}
          imagePullPolicy: {{ .Values.image.sentry.pullPolicy }}
          {{- with .Values.upgrade.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["sentry", "upgrade", "--noinput"]
          env:
            - name: SENTRY_WEB_HOST
              value: "0.0.0.0"
            - name: SENTRY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentry.secretName" . }}
                  key: SENTRY_SECRET_KEY
            - name: SENTRY_DB_NAME
              value: {{ .Values.postgres.database | quote }}
            - name: SENTRY_DB_USER
              value: {{ .Values.postgres.user | quote }}
            - name: SENTRY_DB_PASSWORD
              {{- include "sentry.postgresPasswordEnvValue" . | nindent 14 }}
            - name: SENTRY_POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: SENTRY_POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: SENTRY_REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: SENTRY_REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: SENTRY_REDIS_PASSWORD
              {{- include "sentry.redisPasswordEnvValue" . | nindent 14 }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            {{- if .Values.snuba.api.enabled }}
            - name: SNUBA_HOST
              value: "http://{{ include "sentry.fullname" . }}-snuba-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.snuba.api.port }}"
            {{- end }}
            - name: SENTRY_SYSTEM_URL
              value: {{ .Values.system.url | quote }}
            - name: SENTRY_ADMIN_EMAIL
              value: {{ .Values.user.email | quote }}
            - name: SENTRY_ADMIN_PASSWORD
              {{- include "sentry.adminPasswordEnvValue" . | nindent 14 }}
            {{- if .Values.relay.enabled }}
            - name: SENTRY_RELAY_HOST
              value: {{ include "sentry.fullname" . }}-relay.{{ .Release.Namespace }}.svc.cluster.local
            - name: SENTRY_RELAY_PORT
              value: {{ .Values.relay.port | quote }}
            {{- end }}
          volumeMounts:
            - name: sentry-conf
              mountPath: /etc/sentry
              readOnly: true
      volumes:
        - name: sentry-conf
          configMap:
            name: {{ include "sentry.fullname" . }}-sentry
{{- end }}
