{{- if .Values.ingestConsumer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentry.fullname" . }}-ingest-consumer
  labels:
    {{- include "sentry.ingestConsumerSelectorLabels" . | nindent 4 }}
    {{- include "sentry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingestConsumer.replicas }}
  selector:
    matchLabels:
      {{- include "sentry.ingestConsumerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentry.ingestConsumerSelectorLabels" . | nindent 8 }}
        {{- with .Values.ingestConsumer.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.ingestConsumer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sentry.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestConsumer.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestConsumer.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- if and .Values.kafka.autoCreateTopics .Values.kafka.bootstrapServers }}
      initContainers:
        {{- include "sentry.kafkaTopicInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingest-consumer
          image: {{ include "sentry.workerImage" . }}
          imagePullPolicy: {{ .Values.image.sentry.pullPolicy }}
          {{- with .Values.ingestConsumer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["sentry", "run", "consumer", "ingest-events", "--consumer-group", "ingest-consumer"]
          env:
            - name: SENTRY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentry.secretName" . }}
                  key: SENTRY_SECRET_KEY
            - name: SENTRY_DB_NAME
              value: {{ .Values.postgres.database | quote }}
            - name: SENTRY_DB_USER
              value: {{ .Values.postgres.user | quote }}
            - name: SENTRY_DB_PASSWORD
              {{- include "sentry.postgresPasswordEnvValue" . | nindent 14 }}
            - name: SENTRY_POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: SENTRY_POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: SENTRY_REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: SENTRY_REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: SENTRY_REDIS_PASSWORD
              {{- include "sentry.redisPasswordEnvValue" . | nindent 14 }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: SENTRY_CONF
              value: /etc/sentry
            {{- if .Values.relay.enabled }}
            - name: SENTRY_RELAY_HOST
              value: {{ include "sentry.fullname" . }}-relay
            - name: SENTRY_RELAY_PORT
              value: {{ .Values.relay.port | quote }}
            {{- end }}
            {{- with .Values.ingestConsumer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: sentry-conf
              mountPath: /etc/sentry
              readOnly: true
          {{- with .Values.ingestConsumer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: sentry-conf
          configMap:
            name: {{ include "sentry.fullname" . }}-sentry
      {{- with .Values.ingestConsumer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestConsumer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingestConsumer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
