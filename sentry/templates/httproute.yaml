{{- if .Values.gateway.enabled }}
{{- if .Values.ingress.enabled }}
{{- fail "ingress.enabled and gateway.enabled are mutually exclusive — enable only one" }}
{{- end }}
{{- $gatewayNamespace := .Values.gateway.gatewayNamespace | default .Release.Namespace }}
{{- $hostname := required "gateway.hostname is required when gateway.enabled is true" .Values.gateway.hostname }}
---
# HTTPRoute: SDK event ingestion + internal relay → relay service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sentry.fullname" . }}-relay
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ $hostname }}
  rules:
    # SDK event ingestion (project-specific API)
    - matches:
        - path:
            type: RegularExpression
            value: /api/[1-9][0-9]*/.*
      backendRefs:
        - name: {{ include "sentry.fullname" . }}-relay
          port: {{ .Values.relay.port }}
    # Legacy store endpoint
    - matches:
        - path:
            type: PathPrefix
            value: /api/store
      backendRefs:
        - name: {{ include "sentry.fullname" . }}-relay
          port: {{ .Values.relay.port }}
---
# HTTPRoute: Sentry web (UI + API)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "sentry.fullname" . }}-web
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ $hostname }}
  rules:
    - backendRefs:
        - name: {{ include "sentry.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
