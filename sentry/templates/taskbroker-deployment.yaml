{{- if .Values.taskbroker.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sentry.fullname" . }}-taskbroker
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
    app.kubernetes.io/component: taskbroker
spec:
  serviceName: {{ include "sentry.fullname" . }}-taskbroker
  replicas: {{ .Values.taskbroker.replicas }}
  selector:
    matchLabels:
      {{- include "sentry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: taskbroker
  template:
    metadata:
      labels:
        {{- include "sentry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: taskbroker
        {{- with .Values.taskbroker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.taskbroker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "sentry.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.taskbroker.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.taskbroker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.taskbroker.volumePermissions.enabled (and .Values.kafka.autoCreateTopics .Values.kafka.bootstrapServers) }}
      initContainers:
        {{- if .Values.taskbroker.volumePermissions.enabled }}
        - name: volume-permissions
          image: "{{ .Values.image.busybox.repository }}:{{ .Values.image.busybox.tag }}"
          imagePullPolicy: {{ .Values.image.busybox.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              chown -R {{ .Values.taskbroker.securityContext.runAsUser }}:{{ .Values.taskbroker.securityContext.runAsGroup }} /var/lib/taskbroker
              chmod 750 /var/lib/taskbroker
          securityContext:
            {{- toYaml .Values.taskbroker.volumePermissions.securityContext | nindent 12 }}
          volumeMounts:
            - name: taskbroker-data
              mountPath: /var/lib/taskbroker
        {{- end }}
        {{- if and .Values.kafka.autoCreateTopics .Values.kafka.bootstrapServers }}
        {{- include "sentry.kafkaTopicInitContainer" . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: taskbroker
          image: "{{ .Values.image.taskbroker.repository }}:{{ .Values.image.taskbroker.tag }}"
          imagePullPolicy: {{ .Values.image.taskbroker.pullPolicy }}
          command:
            - /bin/sh
            - -c
          args:
            - mkdir -p /var/lib/taskbroker && exec /opt/taskbroker
          {{- with .Values.taskbroker.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: TASKBROKER_DB_PATH
              value: /var/lib/taskbroker/taskbroker.sqlite
            - name: TASKBROKER_KAFKA_CLUSTER
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: TASKBROKER_KAFKA_TOPIC
              value: {{ .Values.taskbroker.kafkaTopic | quote }}
            - name: TASKBROKER_KAFKA_LONG_TOPIC
              value: {{ .Values.taskbroker.kafkaLongTopic | quote }}
            - name: TASKBROKER_KAFKA_DEADLETTER_TOPIC
              value: {{ .Values.taskbroker.kafkaDeadletterTopic | quote }}
            {{- with .Values.taskbroker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: taskbroker-data
              mountPath: /var/lib/taskbroker
          {{- with .Values.taskbroker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if not .Values.taskbroker.persistence.enabled }}
        - name: taskbroker-data
          emptyDir: {}
        {{- else if .Values.taskbroker.persistence.existingClaim }}
        - name: taskbroker-data
          persistentVolumeClaim:
            claimName: {{ .Values.taskbroker.persistence.existingClaim }}
        {{- end }}
      {{- with .Values.taskbroker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.taskbroker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.taskbroker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.taskbroker.persistence.enabled (not .Values.taskbroker.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: taskbroker-data
        labels:
          {{- include "sentry.taskbrokerSelectorLabels" . | nindent 10 }}
        {{- with .Values.taskbroker.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.taskbroker.persistence.accessMode | quote }}
        {{- if .Values.taskbroker.persistence.storageClass }}
        {{- if eq .Values.taskbroker.persistence.storageClass "-" }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .Values.taskbroker.persistence.storageClass | quote }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.taskbroker.persistence.size | quote }}
  {{- end }}
{{- end }}
