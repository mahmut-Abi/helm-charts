{{- if .Values.relay.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentry.fullname" . }}-relay
  labels:
    {{- include "sentry.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.relay.port }}
      targetPort: relay
      protocol: TCP
      name: relay
  selector:
    {{- include "sentry.relaySelectorLabels" . | nindent 4 }}
{{- end }}