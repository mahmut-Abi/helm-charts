{{- if and (eq .Values.storage.backend "s3") (not .Values.storage.s3.existingSecret) (or .Values.storage.s3.accessKey .Values.storage.s3.secretKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tempo.s3SecretName" . }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.storage.s3.secretKeys.accessKey }}: {{ .Values.storage.s3.accessKey | quote }}
  {{ .Values.storage.s3.secretKeys.secretKey }}: {{ .Values.storage.s3.secretKey | quote }}
{{- end }}
