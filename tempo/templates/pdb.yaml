{{- $pdb := default dict (get .Values "podDisruptionBudget") -}}
{{- $pdbEnabled := true -}}
{{- if hasKey $pdb "enabled" }}{{- $pdbEnabled = get $pdb "enabled" }}{{- end }}
{{- if and $pdbEnabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tempo.fullname" . }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ get $pdb "maxUnavailable" | default 1 }}
  selector:
    matchLabels:
      {{- include "tempo.selectorLabels" . | nindent 6 }}
{{- end }}
