# Number of PostgreSQL instances used when cluster.enabled is false.
replicaCount: 1

image:
  # Official PostgreSQL image.
  repository: postgres
  tag: "16.3"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a dedicated ServiceAccount. When false the cluster default is used.
  create: false
  # Name overrides the generated ServiceAccount name. Only applies when create is true.
  name: ""
  annotations: {}
  automountServiceAccountToken: false

auth:
  postgresUser: postgres
  # Auto-generated on first install when empty and preserved on upgrades.
  postgresPassword: ""
  postgresDatabase: postgres
  # Used only when cluster.enabled is true. Replicas connect to the primary
  # with this role for physical streaming replication.
  replicationUser: replicator
  # Auto-generated on first install when empty and preserved on upgrades.
  replicationPassword: ""
  # Set this to use a pre-created Secret instead of rendering secret.yaml.
  # The Secret must contain keys POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
  # POSTGRES_REPLICATION_USER, POSTGRES_REPLICATION_PASSWORD.
  existingSecret: ""

service:
  type: ClusterIP
  port: 5432
  annotations: {}

containerPorts:
  postgres: 5432

readOnlyService:
  enabled: true
  type: ClusterIP
  port: 5432
  annotations: {}

headlessService:
  annotations: {}

cluster:
  # Standalone mode stays the default. Enable this for one primary StatefulSet
  # plus one replica StatefulSet with physical streaming replication.
  enabled: false
  # Total PostgreSQL pods when cluster.enabled is true. One pod is primary;
  # replicas - 1 pods are read replicas.
  replicas: 3
  primaryConninfoApplicationName: "${POD_NAME}"
  # How long replicas wait between primary readiness checks during bootstrap.
  replicaBootstrapCheckIntervalSeconds: 5

postgresql:
  parameters:
    password_encryption: scram-sha-256
  extraArgs: []

persistence:
  enabled: true
  size: 8Gi
  # Set to a storage class name to request a specific class, "-" to disable
  # dynamic provisioning, or leave empty to use the cluster default.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}

persistentVolumeClaimRetentionPolicy:
  enabled: false
  whenDeleted: Retain
  whenScaled: Retain

volumePermissions:
  enabled: true
  image:
    repository: postgres
    tag: "16.3"
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - FOWNER
        - DAC_OVERRIDE
    seccompProfile:
      type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

pdb:
  enabled: true
  maxUnavailable: 1
  minAvailable: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 999

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

updateStrategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress:
    - {}
  egress: []

# Prometheus ServiceMonitor configuration.
# Deploys a monitoring.coreos.com/v1 ServiceMonitor so the Prometheus
# Operator auto-discovers PostgreSQL metrics endpoints.
serviceMonitor:
  enabled: false
  labels: {}
  endpoints:
    - port: postgres
      interval: 30s
      path: /metrics
