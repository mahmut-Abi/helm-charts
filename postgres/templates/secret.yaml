{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "postgres.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preservePostgresPassword := and (not .Values.auth.postgresPassword) $existing (hasKey $existing.data "POSTGRES_PASSWORD") }}
{{- $preserveReplicationPassword := and (not .Values.auth.replicationPassword) $existing (hasKey $existing.data "POSTGRES_REPLICATION_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
{{- if or $preservePostgresPassword $preserveReplicationPassword }}
data:
  {{- if $preservePostgresPassword }}
  POSTGRES_PASSWORD: {{ index $existing.data "POSTGRES_PASSWORD" }}
  {{- end }}
  {{- if $preserveReplicationPassword }}
  POSTGRES_REPLICATION_PASSWORD: {{ index $existing.data "POSTGRES_REPLICATION_PASSWORD" }}
  {{- end }}
{{- end }}
stringData:
  POSTGRES_USER: {{ required "auth.postgresUser is required" .Values.auth.postgresUser | quote }}
  {{- if .Values.auth.postgresPassword }}
  POSTGRES_PASSWORD: {{ .Values.auth.postgresPassword | quote }}
  {{- else if not $preservePostgresPassword }}
  POSTGRES_PASSWORD: {{ randAlphaNum 32 | quote }}
  {{- end }}
  POSTGRES_DB: {{ required "auth.postgresDatabase is required" .Values.auth.postgresDatabase | quote }}
  POSTGRES_REPLICATION_USER: {{ .Values.auth.replicationUser | quote }}
  {{- if .Values.auth.replicationPassword }}
  POSTGRES_REPLICATION_PASSWORD: {{ .Values.auth.replicationPassword | quote }}
  {{- else if not $preserveReplicationPassword }}
  POSTGRES_REPLICATION_PASSWORD: {{ randAlphaNum 32 | quote }}
  {{- end }}
{{- end }}
