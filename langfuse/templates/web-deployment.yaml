{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "langfuse.fullname" . }}-web
  labels:
    {{- include "langfuse.webSelectorLabels" . | nindent 4 }}
    {{- include "langfuse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "langfuse.webSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "langfuse.webSelectorLabels" . | nindent 8 }}
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "langfuse.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.clickhouse.url }}
      {{- $chHost := .Values.clickhouse.url | splitList "://" | last | splitList ":" | first }}
      initContainers:
        - name: init-clickhouse-db
          image: {{ printf "%s:%s" .Values.image.initContainer.repository .Values.image.initContainer.tag }}
          imagePullPolicy: {{ .Values.image.initContainer.pullPolicy }}
          securityContext:
            {{- toYaml .Values.initContainer.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.initContainer.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until curl -sS -u "${CH_USER}:${CH_PASSWORD}" "${CH_SCHEME}://${CH_HOST}:${CH_PORT}/" --data-binary "CREATE DATABASE IF NOT EXISTS ${CH_DB}"; do
                echo "Waiting for ClickHouse..."
                sleep 2
              done
              echo "ClickHouse database '${CH_DB}' ready."
          env:
            - name: CH_HOST
              value: {{ $chHost | quote }}
            - name: CH_PORT
              value: {{ .Values.clickhouse.httpPort | quote }}
            - name: CH_SCHEME
              value: {{ ternary "https" "http" .Values.clickhouse.tlsEnabled | quote }}
            - name: CH_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CH_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CH_PASSWORD
              {{- include "langfuse.clickhousePasswordEnvValue" . | nindent 14 }}
      {{- end }}
      containers:
        - name: langfuse
          image: {{ include "langfuse.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "langfuse.secretName" . }}
                  key: SALT
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "langfuse.secretName" . }}
                  key: ENCRYPTION_KEY
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "langfuse.secretName" . }}
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              value: {{ .Values.auth.nextauthUrl | quote }}
            - name: DATABASE_URL
              {{- include "langfuse.databaseUrlEnvValue" . | nindent 14 }}
            {{- if .Values.web.nodeOptions }}
            - name: NODE_OPTIONS
              value: {{ .Values.web.nodeOptions | quote }}
            {{- end }}
            {{- if .Values.clickhouse.url }}
            - name: CLICKHOUSE_URL
              value: {{ .Values.clickhouse.url | quote }}
            {{- end }}
            {{- if or .Values.clickhouse.migrationUrl .Values.clickhouse.url }}
            - name: CLICKHOUSE_MIGRATION_URL
              {{- include "langfuse.clickhouseMigrationUrlEnvValue" . | nindent 14 }}
            {{- end }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              {{- include "langfuse.clickhousePasswordEnvValue" . | nindent 14 }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: {{ .Values.clickhouse.clusterEnabled | quote }}
            - name: CLICKHOUSE_CLUSTER_NAME
              value: {{ default "default" .Values.clickhouse.clusterName | quote }}
            - name: CLICKHOUSE_MIGRATION_SSL
              value: {{ .Values.clickhouse.tlsEnabled | quote }}
            - name: LANGFUSE_AUTO_CLICKHOUSE_MIGRATION_DISABLED
              value: {{ .Values.clickhouse.autoMigrationDisabled | quote }}
            {{- if or .Values.redis.connectionString .Values.redis.existingSecret }}
            - name: REDIS_CONNECTION_STRING
              {{- include "langfuse.redisConnectionStringEnvValue" . | nindent 14 }}
            {{- end }}
            {{- if .Values.redis.host }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            {{- end }}
            {{- if .Values.redis.port }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            {{- end }}
            {{- if .Values.redis.tlsEnabled }}
            - name: REDIS_TLS_ENABLED
              value: "true"
            {{- end }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: {{ .Values.s3.region | quote }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              {{- include "langfuse.s3AccessKeyIdEnvValue" . | nindent 14 }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              {{- include "langfuse.s3SecretAccessKeyEnvValue" . | nindent 14 }}
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: {{ .Values.s3.forcePathStyle | toString | quote }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.web.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- if .Values.web.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.web.startupProbe.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.web.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.web.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.web.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.web.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.web.livenessProbe.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.web.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.web.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.web.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.web.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.web.readinessProbe.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.web.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.web.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.web.readinessProbe.failureThreshold }}
          {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
