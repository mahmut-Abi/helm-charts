{{- if and .Values.clickhouseMigrationJob.enabled .Values.clickhouse.url }}
{{- $chHost := .Values.clickhouse.url | splitList "://" | last | splitList ":" | first }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "langfuse.fullname" . }}-clickhouse-migration-{{ .Release.Revision }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.clickhouseMigrationJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.clickhouseMigrationJob.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.clickhouseMigrationJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "langfuse.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "langfuse.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.clickhouseMigrationJob.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.clickhouseMigrationJob.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migration
          image: {{ include "langfuse.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.clickhouseMigrationJob.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.clickhouseMigrationJob.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for ClickHouse at ${CLICKHOUSE_HOST}:${CLICKHOUSE_HTTP_PORT}..."
              retries=0
              until node -e "
                var h = require(process.env.CLICKHOUSE_SCHEME === 'https' ? 'https' : 'http');
                var auth = Buffer.from(process.env.CLICKHOUSE_USER + ':' + process.env.CLICKHOUSE_PASSWORD).toString('base64');
                var req = h.get({host: process.env.CLICKHOUSE_HOST, port: Number(process.env.CLICKHOUSE_HTTP_PORT), path: '/?query=SELECT+1', headers: {Authorization: 'Basic ' + auth}, timeout: 5000}, function(r) {
                  r.resume();
                  r.on('end', function() { process.exit(0); });
                });
                req.on('error', function() { process.exit(1); });
                req.on('timeout', function() { req.destroy(); process.exit(1); });
              "; do
                retries=$((retries + 1))
                if [ $retries -ge 60 ]; then
                  echo "ERROR: ClickHouse not reachable after 5 minutes. Aborting."
                  exit 1
                fi
                echo "ClickHouse not ready (attempt ${retries}/60), retrying in 5s..."
                sleep 5
              done
              echo "ClickHouse ready. Creating database if not exists..."
              node -e "
                var h = require(process.env.CLICKHOUSE_SCHEME === 'https' ? 'https' : 'http');
                var auth = Buffer.from(process.env.CLICKHOUSE_USER + ':' + process.env.CLICKHOUSE_PASSWORD).toString('base64');
                var body = 'CREATE DATABASE IF NOT EXISTS ' + process.env.CLICKHOUSE_DB;
                var req = h.request({host: process.env.CLICKHOUSE_HOST, port: Number(process.env.CLICKHOUSE_HTTP_PORT), path: '/', method: 'POST', headers: {Authorization: 'Basic ' + auth, 'Content-Length': body.length}, timeout: 10000}, function(r) {
                  r.resume();
                  r.on('end', function() { process.exit(0); });
                });
                req.on('error', function() { process.exit(1); });
                req.write(body);
                req.end();
              "
              echo ""
              echo "Running ClickHouse migrations..."
              cd /app/packages/shared && sh clickhouse/scripts/up.sh
              echo ""
              echo "ClickHouse migration completed."
          env:
            - name: CLICKHOUSE_HOST
              value: {{ $chHost | quote }}
            - name: CLICKHOUSE_HTTP_PORT
              value: {{ .Values.clickhouse.httpPort | quote }}
            - name: CLICKHOUSE_SCHEME
              value: {{ ternary "https" "http" .Values.clickhouse.tlsEnabled | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              {{- include "langfuse.clickhousePasswordEnvValue" . | nindent 14 }}
            - name: CLICKHOUSE_MIGRATION_URL
              {{- include "langfuse.clickhouseMigrationUrlEnvValue" . | nindent 14 }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: {{ .Values.clickhouse.clusterEnabled | quote }}
            - name: CLICKHOUSE_CLUSTER_NAME
              value: {{ default "default" .Values.clickhouse.clusterName | quote }}
            - name: CLICKHOUSE_MIGRATION_SSL
              value: {{ .Values.clickhouse.tlsEnabled | quote }}
{{- end }}
