{{- if .Values.clickhouse.url }}
{{- $chHost := .Values.clickhouse.url | splitList "://" | last | splitList ":" | first }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "langfuse.fullname" . }}-clickhouse-migration
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "5"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "langfuse.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migration
          image: {{ include "langfuse.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          command:
            - sh
            - -c
            - |
              echo "Waiting for ClickHouse at ${CLICKHOUSE_HOST}:8123..."
              retries=0
              until curl -sS -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}" "http://${CLICKHOUSE_HOST}:8123/" --data-binary "SELECT 1" > /dev/null; do
                retries=$((retries + 1))
                if [ $retries -ge 60 ]; then
                  echo "ERROR: ClickHouse not reachable after 5 minutes. Aborting."
                  exit 1
                fi
                echo "ClickHouse not ready (attempt ${retries}/60), retrying in 5s..."
                sleep 5
              done
              echo "ClickHouse ready. Creating database if not exists..."
              curl -sS -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}" "http://${CLICKHOUSE_HOST}:8123/" --data-binary "CREATE DATABASE IF NOT EXISTS ${CLICKHOUSE_DB}"
              echo ""
              echo "Running ClickHouse migrations..."
              cd /app/packages/shared && sh clickhouse/scripts/up.sh
              echo ""
              echo "ClickHouse migration completed."
          env:
            - name: CLICKHOUSE_HOST
              value: {{ $chHost | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            {{- if .Values.clickhouse.password }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.clickhouse.password | quote }}
            {{- else if .Values.clickhouse.existingSecret }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.existingSecret }}
                  key: {{ default "CLICKHOUSE_PASSWORD" .Values.clickhouse.existingSecretKey }}
            {{- end }}
            - name: CLICKHOUSE_MIGRATION_URL
              value: {{ include "langfuse.clickhouseMigrationUrl" . | quote }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: {{ .Values.clickhouse.clusterEnabled | quote }}
            - name: CLICKHOUSE_CLUSTER_NAME
              value: {{ default "default" .Values.clickhouse.clusterName | quote }}
            - name: CLICKHOUSE_MIGRATION_SSL
              value: {{ .Values.clickhouse.tlsEnabled | quote }}
{{- end }}