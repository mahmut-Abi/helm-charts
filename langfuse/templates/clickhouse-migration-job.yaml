{{- if .Values.clickhouse.url }}
{{- $chHost := .Values.clickhouse.url | splitList "://" | last | splitList ":" | first }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "langfuse.fullname" . }}-clickhouse-migration
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "5"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "langfuse.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migration
          image: {{ include "langfuse.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          command:
            - sh
            - -c
            - |
              echo "Waiting for ClickHouse at ${CLICKHOUSE_HOST}:8123..."
              retries=0
              until node -e "
                var h = require('http');
                var auth = Buffer.from(process.env.CLICKHOUSE_USER + ':' + process.env.CLICKHOUSE_PASSWORD).toString('base64');
                var req = h.get({host: process.env.CLICKHOUSE_HOST, port: 8123, path: '/?query=SELECT+1', headers: {Authorization: 'Basic ' + auth}, timeout: 5000}, function(r) {
                  r.resume();
                  r.on('end', function() { process.exit(0); });
                });
                req.on('error', function() { process.exit(1); });
                req.on('timeout', function() { req.destroy(); process.exit(1); });
              "; do
                retries=$((retries + 1))
                if [ $retries -ge 60 ]; then
                  echo "ERROR: ClickHouse not reachable after 5 minutes. Aborting."
                  exit 1
                fi
                echo "ClickHouse not ready (attempt ${retries}/60), retrying in 5s..."
                sleep 5
              done
              echo "ClickHouse ready. Creating database if not exists..."
              node -e "
                var h = require('http');
                var auth = Buffer.from(process.env.CLICKHOUSE_USER + ':' + process.env.CLICKHOUSE_PASSWORD).toString('base64');
                var body = 'CREATE DATABASE IF NOT EXISTS ' + process.env.CLICKHOUSE_DB;
                var req = h.request({host: process.env.CLICKHOUSE_HOST, port: 8123, path: '/', method: 'POST', headers: {Authorization: 'Basic ' + auth, 'Content-Length': body.length}, timeout: 10000}, function(r) {
                  r.resume();
                  r.on('end', function() { process.exit(0); });
                });
                req.on('error', function() { process.exit(1); });
                req.write(body);
                req.end();
              "
              echo ""
              echo "Running ClickHouse migrations..."
              cd /app/packages/shared && sh clickhouse/scripts/up.sh
              echo ""
              echo "ClickHouse migration completed."
          env:
            - name: CLICKHOUSE_HOST
              value: {{ $chHost | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            {{- if .Values.clickhouse.password }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.clickhouse.password | quote }}
            {{- else if .Values.clickhouse.existingSecret }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.existingSecret }}
                  key: {{ default "CLICKHOUSE_PASSWORD" .Values.clickhouse.existingSecretKey }}
            {{- end }}
            - name: CLICKHOUSE_MIGRATION_URL
              value: {{ include "langfuse.clickhouseMigrationUrl" . | quote }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: {{ .Values.clickhouse.clusterEnabled | quote }}
            - name: CLICKHOUSE_CLUSTER_NAME
              value: {{ default "default" .Values.clickhouse.clusterName | quote }}
            - name: CLICKHOUSE_MIGRATION_SSL
              value: {{ .Values.clickhouse.tlsEnabled | quote }}
{{- end }}