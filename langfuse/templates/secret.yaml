{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "langfuse.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
type: Opaque
{{- if $existing }}
data:
  SALT: {{ index $existing.data "SALT" }}
  ENCRYPTION_KEY: {{ index $existing.data "ENCRYPTION_KEY" }}
  NEXTAUTH_SECRET: {{ index $existing.data "NEXTAUTH_SECRET" }}
{{- else }}
stringData:
  SALT: {{ .Values.auth.salt | default (randAlphaNum 32) | quote }}
  ENCRYPTION_KEY: {{ .Values.auth.encryptionKey | default (randAlphaNum 64) | quote }}
  NEXTAUTH_SECRET: {{ .Values.auth.nextauthSecret | default (randAlphaNum 64) | quote }}
{{- end }}
{{- end }}