{{- if eq (include "langfuse.renderGeneratedSecret" .) "true" }}
{{- $secretName := include "langfuse.credentialsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preserveAuth := and (not .Values.auth.existingSecret) $existing (hasKey $existing.data "SALT") (hasKey $existing.data "ENCRYPTION_KEY") (hasKey $existing.data "NEXTAUTH_SECRET") }}
{{- $hasStringData := or (and (not .Values.auth.existingSecret) (not $preserveAuth)) .Values.postgres.password .Values.postgres.directUrl .Values.clickhouse.password .Values.clickhouse.migrationUrl .Values.redis.connectionString .Values.s3.accessKeyId .Values.s3.secretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
type: Opaque
{{- if $preserveAuth }}
data:
  SALT: {{ index $existing.data "SALT" }}
  ENCRYPTION_KEY: {{ index $existing.data "ENCRYPTION_KEY" }}
  NEXTAUTH_SECRET: {{ index $existing.data "NEXTAUTH_SECRET" }}
{{- end }}
{{- if $hasStringData }}
stringData:
  {{- if and (not .Values.auth.existingSecret) (not $preserveAuth) }}
  SALT: {{ .Values.auth.salt | default (randAlphaNum 32) | quote }}
  ENCRYPTION_KEY: {{ .Values.auth.encryptionKey | default (randAlphaNum 64) | quote }}
  NEXTAUTH_SECRET: {{ .Values.auth.nextauthSecret | default (randAlphaNum 64) | quote }}
  {{- end }}
  {{- if or .Values.postgres.password .Values.postgres.directUrl }}
  DATABASE_URL: {{ include "langfuse.databaseUrlValue" . | quote }}
  {{- end }}
  {{- if .Values.clickhouse.password }}
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  {{- end }}
  {{- if or .Values.clickhouse.migrationUrl .Values.clickhouse.password }}
  CLICKHOUSE_MIGRATION_URL: {{ include "langfuse.clickhouseMigrationUrlValue" . | quote }}
  {{- end }}
  {{- if .Values.redis.connectionString }}
  REDIS_CONNECTION_STRING: {{ .Values.redis.connectionString | quote }}
  {{- end }}
  {{- if .Values.s3.accessKeyId }}
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId | quote }}
  {{- end }}
  {{- if .Values.s3.secretAccessKey }}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
