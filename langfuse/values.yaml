image:
  repository: ghcr.io/langfuse/langfuse
  tag: "3.177.1"
  pullPolicy: IfNotPresent
  # Init container image used to create the ClickHouse database before migrations.
  initContainer:
    repository: alpine/curl
    tag: "8.19.0"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Langfuse requires several secrets for encryption and authentication.
# Generate strong random values for production. Required.
auth:
  # SALT: Random string for password hashing. Auto-generated if not set.
  # salt: ""
  salt: ""
  # ENCRYPTION_KEY: 256-bit key for encrypting sensitive data. Auto-generated if not set.
  # encryptionKey: ""
  encryptionKey: ""
  # NEXTAUTH_SECRET: Random string for NextAuth.js. Auto-generated if not set.
  # nextauthSecret: ""
  nextauthSecret: ""
  # NEXTAUTH_URL: Public URL of the Langfuse instance.
  nextauthUrl: "http://localhost:3000"
  # Set this to use a pre-created Secret instead of rendering secret.yaml.
  # The Secret must contain keys: SALT, ENCRYPTION_KEY, NEXTAUTH_SECRET.
  existingSecret: ""

# PostgreSQL connection. Point to an existing PostgreSQL instance.
postgres:
  host: ""
  port: 5432
  database: postgres
  user: postgres
  # password: ""  -- must be set or use postgres.existingSecret
  password: ""
  schema: public
  # Existing Secret should contain DATABASE_URL unless directUrl is set.
  existingSecret: ""
  existingSecretKey: ""
  # Direct DATABASE_URL override. When set, individual host/port/db/user fields are ignored.
  directUrl: ""

# ClickHouse connection. Point to an existing ClickHouse instance.
clickhouse:
  url: ""
  migrationUrl: ""
  httpPort: 8123
  database: default
  user: default
  # password: ""  -- must be set or use clickhouse.existingSecret
  password: ""
  clusterEnabled: false
  # Cluster name for ON CLUSTER DDL. Defaults to "default" if not set.
  clusterName: "default"
  # Number of ClickHouse replicas when clusterEnabled is true.
  # The migration Job connects to each replica individually to ensure
  # schema changes reach all nodes (especially with non-replicated tables).
  replicas: 1
  tlsEnabled: false
  existingSecret: ""
  existingSecretKey: ""
  migrationUrlExistingSecretKey: ""
  # Disable automatic ClickHouse migrations in the web/worker pods.
  # When true, migrations are handled ONLY by the post-install/post-upgrade Job
  # (clickhouse-migration-job.yaml). Set to false to let the web pod also run
  # migrations at startup (redundant but idempotent).
  autoMigrationDisabled: true

# Redis connection. Point to an existing Redis instance.
redis:
  connectionString: ""
  host: ""
  port: 6379
  tlsEnabled: false
  existingSecret: ""
  existingSecretKey: ""

# S3-compatible storage for events and media.
s3:
  enabled: false
  endpoint: ""
  region: "auto"
  bucket: "langfuse"
  accessKeyId: ""
  secretAccessKey: ""
  forcePathStyle: false
  existingSecret: ""
  existingSecretAccessKeyIdKey: ""
  existingSecretSecretAccessKeyKey: ""

initContainer:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

# Web server (Next.js frontend + API).
web:
  enabled: true
  replicas: 1
  port: 3000
  # Image for the web container. Falls back to global image if not set.
  image:
    repository: ""
    tag: ""
  # Node.js --max-old-space-size. Defaults to empty (Node.js auto-detects).
  nodeOptions: ""
  priorityClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  startupProbe:
    enabled: true
    path: /api/public/health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 60
  readinessProbe:
    enabled: true
    path: /api/public/health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  livenessProbe:
    enabled: true
    path: /api/public/health
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 6
  # Extra environment variables passed to the web container.
  extraEnv: []
  extraEnvFrom: []

# Background worker for async processing.
worker:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/langfuse/langfuse-worker
    tag: ""
  # Node.js --max-old-space-size. Defaults to empty (Node.js auto-detects).
  nodeOptions: ""
  priorityClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  startupProbe:
    enabled: true
    port: 3030
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 60
  readinessProbe:
    enabled: true
    port: 3030
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 6
  livenessProbe:
    enabled: true
    port: 3030
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 6
  extraEnv: []
  extraEnvFrom: []

service:
  type: ClusterIP
  port: 3000
  annotations: {}

serviceMonitor:
  enabled: false
  labels: {}
  endpoints:
    - port: http
      interval: 30s
      path: /metrics

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podDisruptionBudget:
  web:
    enabled: true
    minAvailable: 1
  worker:
    enabled: true
    minAvailable: 1

networkPolicy:
  enabled: false
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

clickhouseMigrationJob:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 1800
  priorityClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

revisionHistoryLimit: 10

# Ingress (standard Kubernetes Ingress) for the web UI.
ingress:
  enabled: false
  className: nginx
  hostname: ""
  additionalHostNames: []
  labels: {}
  annotations: {}
  tls: []

# Gateway API (HTTPRoute) for the web UI. Mutually exclusive with ingress.
gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  hostname: ""
