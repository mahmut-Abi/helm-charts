# Number of Redis pods used when cluster.enabled is false.
replicaCount: 1

image:
  # Official Redis image repository.
  repository: redis
  # Pin to a stable Redis tag. Override when you need a specific version.
  tag: "7.4.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

auth:
  # Enable Redis password authentication.
  enabled: true
  # Auto-generated on first install when empty and preserved on upgrades.
  password: ""
  # Set this to use a pre-created Secret instead of rendering secret.yaml.
  # The Secret must contain key "redis-password".
  existingSecret: ""

service:
  # ClusterIP is appropriate for in-cluster access.
  type: ClusterIP
  port: 6379
  # Optional annotations for the client-facing Service.
  annotations: {}
  # Optional annotations for the headless Service used by the StatefulSet.
  headlessAnnotations: {}

cluster:
  # Standalone mode stays the default. Enable this for Redis Cluster.
  enabled: false
  # Number of master nodes. Redis Cluster requires at least 3 masters.
  masters: 3
  # Replica count per master. Set to 0 for master-only clusters.
  replicasPerMaster: 1
  clusterDomain: cluster.local
  busPort: 16379
  nodeTimeoutMs: 5000
  # Use stable StatefulSet DNS names in MOVED/ASK responses.
  preferredEndpointType: hostname
  # Optional job settings for the post-install/post-upgrade cluster bootstrap.
  initJob:
    enabled: true
    backoffLimit: 20
    activeDeadlineSeconds: 600
    annotations: {}
    podAnnotations: {}
    podLabels: {}

persistence:
  # Enable a PersistentVolumeClaim for Redis data.
  enabled: true
  size: 8Gi
  # Leave empty to use the cluster default StorageClass. Set to "-" to disable dynamic provisioning.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}

persistentVolumeClaimRetentionPolicy:
  # Enable persistentVolumeClaimRetentionPolicy on the StatefulSet.
  # When enabled, controls whether PVCs are retained or deleted when the
  # StatefulSet is deleted or scaled down.
  enabled: false
  whenDeleted: Retain
  whenScaled: Retain

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 999

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

updateStrategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 30

startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# Leave empty to use OrderedReady for standalone mode and Parallel for cluster
# mode. Set explicitly to override either behavior.
podManagementPolicy: ""

networkPolicy:
  # Enable to create a NetworkPolicy that restricts traffic.
  enabled: false
  policyTypes:
    - Ingress
  ingress:
    - {}
  egress: []

redis:
  # Extra command-line arguments appended to redis-server.
  extraArgs: []

metrics:
  exporter:
    # redis-exporter sidecar — exposes Redis metrics at /metrics.
    enabled: false
    image:
      repository: redis/redis-exporter
      tag: "v1.68.0"
      pullPolicy: IfNotPresent
    port: 9121
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

serviceMonitor:
  # Enable to create a Prometheus ServiceMonitor for Redis metrics.
  enabled: false
  # Labels to add to the ServiceMonitor resource (useful for Prometheus auto-discovery).
  labels: {}
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
