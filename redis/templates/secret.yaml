{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $secretName := include "redis.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preservePassword := and (not .Values.auth.password) $existing (hasKey $existing.data "redis-password") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
type: Opaque
{{- if $preservePassword }}
data:
  redis-password: {{ index $existing.data "redis-password" }}
{{- end }}
stringData:
  {{- if .Values.auth.password }}
  redis-password: {{ .Values.auth.password | quote }}
  {{- else if not $preservePassword }}
  redis-password: {{ randAlphaNum 32 | quote }}
  {{- end }}
{{- end }}
