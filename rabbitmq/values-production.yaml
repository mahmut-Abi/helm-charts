# High-load production example. Replace StorageClass and Secret names before use.
serviceAccount:
  create: true
  automountServiceAccountToken: false

auth:
  existingSecret: rabbitmq-prod-auth

cluster:
  enabled: true
  replicas: 3

persistence:
  enabled: true
  size: 300Gi
  storageClass: premium-rwo
  accessModes:
    - ReadWriteOnce

persistentVolumeClaimRetentionPolicy:
  enabled: true
  whenDeleted: Retain
  whenScaled: Retain

resources:
  requests:
    cpu: 2
    memory: 8Gi
  limits:
    cpu: 4
    memory: 16Gi

serviceMonitor:
  # Enable only after enabling the rabbitmq_prometheus plugin or adding an exporter.
  enabled: false
  labels:
    release: prometheus

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
  ingress:
    - {}

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: rabbitmq
