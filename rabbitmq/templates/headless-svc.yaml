apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.headlessServiceName" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
  {{- with .Values.headlessService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  # publishNotReadyAddresses enables nodes to discover each other via
  # the headless Service before they are individually ready, which is
  # required for cluster formation.
  publishNotReadyAddresses: true
  ports:
    - name: amqp
      port: {{ .Values.service.amqpPort }}
      targetPort: amqp
      protocol: TCP
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
    - name: epmd
      port: {{ .Values.service.epmdPort }}
      targetPort: epmd
      protocol: TCP
    - name: dist
      port: {{ .Values.cluster.distPort }}
      targetPort: dist
      protocol: TCP
  selector:
    {{- include "rabbitmq.selectorLabels" . | nindent 4 }}