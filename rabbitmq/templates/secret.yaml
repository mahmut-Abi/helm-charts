{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "rabbitmq.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preserveDefaultPass := and (not .Values.auth.defaultPass) $existing (hasKey $existing.data "RABBITMQ_DEFAULT_PASS") }}
{{- $preserveErlangCookie := and (not .Values.auth.erlangCookie) $existing (hasKey $existing.data "RABBITMQ_ERLANG_COOKIE") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
type: Opaque
{{- if or $preserveDefaultPass $preserveErlangCookie }}
data:
  {{- if $preserveDefaultPass }}
  RABBITMQ_DEFAULT_PASS: {{ index $existing.data "RABBITMQ_DEFAULT_PASS" }}
  {{- end }}
  {{- if $preserveErlangCookie }}
  RABBITMQ_ERLANG_COOKIE: {{ index $existing.data "RABBITMQ_ERLANG_COOKIE" }}
  {{- end }}
{{- end }}
stringData:
  RABBITMQ_DEFAULT_USER: {{ required "auth.defaultUser is required" .Values.auth.defaultUser | quote }}
  {{- if .Values.auth.defaultPass }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.auth.defaultPass | quote }}
  {{- else if not $preserveDefaultPass }}
  RABBITMQ_DEFAULT_PASS: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.auth.erlangCookie }}
  RABBITMQ_ERLANG_COOKIE: {{ .Values.auth.erlangCookie | quote }}
  {{- else if not $preserveErlangCookie }}
  RABBITMQ_ERLANG_COOKIE: {{ randAlphaNum 32 | quote }}
  {{- end }}
{{- end }}
