{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.secretName" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
type: Opaque
data:
  KAFKA_INTER_BROKER_USER: {{ required "auth.interBrokerUser is required when auth.enabled is true" .Values.auth.interBrokerUser | toString | b64enc | quote }}
  KAFKA_INTER_BROKER_PASSWORD: {{ required "auth.interBrokerPassword is required when auth.enabled is true" .Values.auth.interBrokerPassword | toString | b64enc | quote }}
  {{- range $i, $entry := .Values.auth.clientUsers }}
  KAFKA_CLIENT_USER_{{ $i }}: {{ required "each clientUser must have a user" $entry.user | toString | b64enc | quote }}
  KAFKA_CLIENT_PASSWORD_{{ $i }}: {{ required "each clientUser must have a password" $entry.password | toString | b64enc | quote }}
  {{- end }}
{{- end }}