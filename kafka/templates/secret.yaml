{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $secretName := include "kafka.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preserveInterBrokerPassword := and (not .Values.auth.interBrokerPassword) $existing (hasKey $existing.data "KAFKA_INTER_BROKER_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
type: Opaque
{{- if $preserveInterBrokerPassword }}
data:
  KAFKA_INTER_BROKER_PASSWORD: {{ index $existing.data "KAFKA_INTER_BROKER_PASSWORD" }}
{{- end }}
stringData:
  KAFKA_INTER_BROKER_USER: {{ required "auth.interBrokerUser is required when auth.enabled is true" .Values.auth.interBrokerUser | toString | quote }}
  {{- if .Values.auth.interBrokerPassword }}
  KAFKA_INTER_BROKER_PASSWORD: {{ .Values.auth.interBrokerPassword | toString | quote }}
  {{- else if not $preserveInterBrokerPassword }}
  KAFKA_INTER_BROKER_PASSWORD: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- range $i, $entry := .Values.auth.clientUsers }}
  KAFKA_CLIENT_USER_{{ $i }}: {{ required "each clientUser must have a user" $entry.user | toString | quote }}
  KAFKA_CLIENT_PASSWORD_{{ $i }}: {{ required "each clientUser must have a password" $entry.password | toString | quote }}
  {{- end }}
{{- end }}
