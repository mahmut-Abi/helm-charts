apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.headlessServiceName" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: external
      port: {{ .Values.service.externalPort }}
      targetPort: external
      protocol: TCP
    - name: controller
      port: {{ .Values.kraft.controllerPort }}
      targetPort: controller
      protocol: TCP
    {{- if .Values.metrics.jmxExporter.enabled }}
    - name: metrics
      port: {{ .Values.metrics.jmxExporter.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  {{- if and (gt (int .Values.service.nodePort) 0) (le (int .Values.service.nodePort) 32767) }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ if and (gt (int .Values.service.nodePort) 0) (le (int .Values.service.nodePort) 32767) }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
    - name: external
      port: {{ .Values.service.externalPort }}
      targetPort: external
      protocol: TCP
      {{- if and (gt (int .Values.service.nodePort) 0) (le (int .Values.service.nodePort) 32767) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if .Values.metrics.jmxExporter.enabled }}
    - name: metrics
      port: {{ .Values.metrics.jmxExporter.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}