{{- include "kafka.validateValues" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "kafka.headlessServiceName" . }}
  replicas: {{ .Values.replicas }}
  {{- if and .Values.persistence.enabled .Values.persistentVolumeClaimRetentionPolicy.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistentVolumeClaimRetentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.persistentVolumeClaimRetentionPolicy.whenScaled }}
  {{- end }}
  podManagementPolicy: Parallel
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes | toYaml | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    {{- if .Values.persistence.kraftDedicated }}
    - metadata:
        name: kraft
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.kraftSize }}
    {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kafka.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        - name: volume-permissions
          image: "{{ .Values.image.busybox.repository }}:{{ .Values.image.busybox.tag }}"
          imagePullPolicy: {{ .Values.image.busybox.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              chown -R {{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.runAsGroup }} /var/lib/kafka/data
              chmod 700 /var/lib/kafka/data
              {{- if .Values.persistence.kraftDedicated }}
              chown -R {{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.runAsGroup }} /var/lib/kafka/kraft
              chmod 700 /var/lib/kafka/kraft
              {{- end }}
          securityContext:
            {{- toYaml .Values.volumePermissions.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            {{- if .Values.persistence.kraftDedicated }}
            - name: kraft
              mountPath: /var/lib/kafka/kraft
            {{- end }}
      {{- end }}
      containers:
        - name: kafka
          image: "{{ .Values.image.kafka.repository }}:{{ .Values.image.kafka.tag }}"
          imagePullPolicy: {{ .Values.image.kafka.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              export KAFKA_CLUSTER_ID="{{ include "kafka.clusterId" . }}"
              export KAFKA_NODE_ID=${HOSTNAME##*-}
              {{- if .Values.heapOpts }}
              export KAFKA_HEAP_OPTS="{{ .Values.heapOpts }}"
              {{- end }}
              {{- if .Values.auth.enabled }}
              export KAFKA_INTER_BROKER_USER=$(cat /etc/kafka/secrets/KAFKA_INTER_BROKER_USER)
              export KAFKA_INTER_BROKER_PASSWORD=$(cat /etc/kafka/secrets/KAFKA_INTER_BROKER_PASSWORD)
              {{- end }}

              # Substitute env vars in server.properties.
              sed \
                "s/\${KAFKA_NODE_ID}/${KAFKA_NODE_ID}/g" \
                /etc/kafka/server.properties > /tmp/server.properties
              {{- if .Values.auth.enabled }}

              plaintext_jaas="listener.name.plaintext.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username=\"${KAFKA_INTER_BROKER_USER}\" password=\"${KAFKA_INTER_BROKER_PASSWORD}\" user_${KAFKA_INTER_BROKER_USER}=\"${KAFKA_INTER_BROKER_PASSWORD}\""
              {{- range $i, $_ := .Values.auth.clientUsers }}
              client_user_{{ $i }}=$(cat /etc/kafka/secrets/KAFKA_CLIENT_USER_{{ $i }})
              client_password_{{ $i }}=$(cat /etc/kafka/secrets/KAFKA_CLIENT_PASSWORD_{{ $i }})
              plaintext_jaas="${plaintext_jaas} user_${client_user_{{ $i }}}=\"${client_password_{{ $i }}}\""
              {{- end }}
              printf '%s;\n' "${plaintext_jaas}" >> /tmp/server.properties
              printf 'listener.name.controller.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="%s" password="%s" user_%s="%s";\n' \
                "${KAFKA_INTER_BROKER_USER}" "${KAFKA_INTER_BROKER_PASSWORD}" "${KAFKA_INTER_BROKER_USER}" "${KAFKA_INTER_BROKER_PASSWORD}" >> /tmp/server.properties
              cat > /tmp/client.properties <<EOF
              security.protocol=SASL_PLAINTEXT
              sasl.mechanism=PLAIN
              sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_INTER_BROKER_USER}" password="${KAFKA_INTER_BROKER_PASSWORD}";
              EOF
              {{- end }}

              # Format storage directory if it doesn't contain the cluster ID yet
              if [ -f /var/lib/kafka/data/meta.properties ]; then
                STORED_ID=$(sed -n 's/^cluster\.id=//p' /var/lib/kafka/data/meta.properties | tr -d '-' | tr '[:upper:]' '[:lower:]')
                if [ "$STORED_ID" != "$KAFKA_CLUSTER_ID" ]; then
                  echo "Error: existing data directory has a different cluster ID (stored: $STORED_ID, expected: $KAFKA_CLUSTER_ID). Aborting."
                  exit 1
                fi
              else
                echo "Formatting KRaft storage with cluster ID: ${KAFKA_CLUSTER_ID}"
                /opt/kafka/bin/kafka-storage.sh format \
                  --config /tmp/server.properties \
                  --cluster-id "${KAFKA_CLUSTER_ID}" \
                  --ignore-formatted
              fi

              exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
          ports:
            - name: external
              containerPort: {{ .Values.service.externalPort }}
              protocol: TCP
            - name: controller
              containerPort: {{ .Values.kraft.controllerPort }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            {{- if .Values.persistence.kraftDedicated }}
            - name: kraft
              mountPath: /var/lib/kafka/kraft
            {{- end }}
            - name: config
              mountPath: /etc/kafka/server.properties
              subPath: server.properties
            {{- if .Values.auth.enabled }}
            - name: auth-secret
              mountPath: /etc/kafka/secrets
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  {{- if .Values.auth.enabled }}
                  /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:{{ .Values.service.externalPort }} --command-config /tmp/client.properties describe --status 2>/dev/null | grep -q "LeaderId"
                  {{- else }}
                  /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:{{ .Values.service.externalPort }} describe --status 2>/dev/null | grep -q "LeaderId"
                  {{- end }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  {{- if .Values.auth.enabled }}
                  /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:{{ .Values.service.externalPort }} --command-config /tmp/client.properties describe --status 2>/dev/null | grep -q "LeaderId"
                  {{- else }}
                  /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:{{ .Values.service.externalPort }} describe --status 2>/dev/null | grep -q "LeaderId"
                  {{- end }}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  {{- if .Values.auth.enabled }}
                  /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:{{ .Values.service.externalPort }} --command-config /tmp/client.properties describe --status 2>/dev/null | grep -q "LeaderId"
                  {{- else }}
                  /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:{{ .Values.service.externalPort }} describe --status 2>/dev/null | grep -q "LeaderId"
                  {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- if .Values.persistence.kraftDedicated }}
        - name: kraft
          emptyDir: {}
        {{- end }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "kafka.fullname" . }}-config
        {{- if .Values.auth.enabled }}
        - name: auth-secret
          secret:
            secretName: {{ include "kafka.secretName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
