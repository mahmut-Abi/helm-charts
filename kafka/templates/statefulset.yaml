{{- include "kafka.validateValues" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "kafka.headlessServiceName" . }}
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "kafka.selectorLabels" . | nindent 6 }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes: {{ .Values.persistence.accessModes | toYaml | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
    {{- if .Values.persistence.kraftDedicated }}
    - metadata:
        name: kraft
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.kraftSize }}
    {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "kafka.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        - name: volume-permissions
          image: "{{ .Values.image.busybox.repository }}:{{ .Values.image.busybox.tag }}"
          imagePullPolicy: {{ .Values.image.busybox.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              chown -R {{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.runAsGroup }} /var/lib/kafka/data
              chmod 700 /var/lib/kafka/data
              {{- if .Values.persistence.kraftDedicated }}
              chown -R {{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.runAsGroup }} /var/lib/kafka/kraft
              chmod 700 /var/lib/kafka/kraft
              {{- end }}
          securityContext:
            {{- toYaml .Values.volumePermissions.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            {{- if .Values.persistence.kraftDedicated }}
            - name: kraft
              mountPath: /var/lib/kafka/kraft
            {{- end }}
      {{- end }}
      containers:
        - name: kafka
          image: "{{ .Values.image.kafka.repository }}:{{ .Values.image.kafka.tag }}"
          imagePullPolicy: {{ .Values.image.kafka.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export KAFKA_CLUSTER_ID=$(echo -n "{{ include "kafka.fullname" . }}" | sha256sum | cut -c1-22 | tr 'a-f' 'A-F' | sed 's/.\{4\}/&-/g; s/-$//')
              export KAFKA_NODE_ID=${HOSTNAME##*-}
              {{- if .Values.heapOpts }}
              export KAFKA_HEAP_OPTS="{{ .Values.heapOpts }}"
              {{- end }}
              {{- if .Values.auth.enabled }}
              export KAFKA_INTER_BROKER_USER=$(cat /etc/kafka/secrets/KAFKA_INTER_BROKER_USER)
              export KAFKA_INTER_BROKER_PASSWORD=$(cat /etc/kafka/secrets/KAFKA_INTER_BROKER_PASSWORD)
              {{- end }}

              # Substitute env vars in server.properties
              sed \
                "s/\${KAFKA_NODE_ID}/${KAFKA_NODE_ID}/g" \
                {{- if .Values.auth.enabled }}
                -e "s/\${KAFKA_INTER_BROKER_USER}/${KAFKA_INTER_BROKER_USER}/g" \
                -e "s/\${KAFKA_INTER_BROKER_PASSWORD}/${KAFKA_INTER_BROKER_PASSWORD}/g" \
                {{- end }}
                /etc/kafka/server.properties > /tmp/server.properties

              # Format storage directory if it doesn't contain the cluster ID yet
              if [ -f /var/lib/kafka/data/meta.properties ]; then
                if ! grep -q "cluster.id=${KAFKA_CLUSTER_ID}" /var/lib/kafka/data/meta.properties; then
                  echo "Error: existing data directory has a different cluster ID. Aborting."
                  exit 1
                fi
              else
                echo "Formatting KRaft storage with cluster ID: ${KAFKA_CLUSTER_ID}"
                /opt/kafka/bin/kafka-storage.sh format \
                  --config /tmp/server.properties \
                  --cluster-id "${KAFKA_CLUSTER_ID}" \
                  --ignore-formatted
              fi

              exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
          ports:
            - name: external
              containerPort: {{ .Values.service.externalPort }}
              protocol: TCP
            - name: controller
              containerPort: {{ .Values.kraft.controllerPort }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            {{- if .Values.persistence.kraftDedicated }}
            - name: kraft
              mountPath: /var/lib/kafka/kraft
            {{- end }}
            - name: config
              mountPath: /etc/kafka/server.properties
              subPath: server.properties
            {{- if .Values.auth.enabled }}
            - name: auth-secret
              mountPath: /etc/kafka/secrets
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:{{ .Values.service.externalPort }} describe --status 2>/dev/null | grep -q "LeaderId"
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  /opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server localhost:{{ .Values.service.externalPort }} describe --status 2>/dev/null | grep -q "LeaderId"
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kafka.fullname" . }}-config
        {{- if .Values.auth.enabled }}
        - name: auth-secret
          secret:
            secretName: {{ include "kafka.secretName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}