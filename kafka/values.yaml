# Default values for Kafka Helm chart.

image:
  kafka:
    repository: apache/kafka
    tag: "4.3.0"
    pullPolicy: IfNotPresent
  busybox:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  kafkaUi:
    repository: provectuslabs/kafka-ui
    tag: "v0.7.2"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# Number of Kafka broker replicas. Must be >= 1.
# For KRaft quorum, use an odd number (3, 5, ...).
replicas: 3

# SASL authentication configuration.
# When enabled, SASL/PLAIN is used for inter-broker and client communication.
auth:
  enabled: false
  # clientUsers is a list of user:password pairs for client access.
  # Each user gets a SCRAM-SHA-256 credential.
  clientUsers: []
  # - user: admin
  #   password: strong-random-password
  # interBrokerUser and interBrokerPassword for inter-broker communication.
  # Leave interBrokerPassword empty to generate it on first install and reuse it on upgrade.
  interBrokerUser: kafka
  interBrokerPassword: ""
  # Set this to use a pre-created Secret instead of rendering secret.yaml.
  # The Secret should contain keys matching the SASL credentials.
  existingSecret: ""

# KRaft-specific settings.
kraft:
  # Keep this value stable for the lifetime of existing PVCs. If empty, the
  # chart derives a deterministic ID from the release name.
  clusterId: ""
  # Port used for controller-to-controller and broker-to-controller communication.
  controllerPort: 9093
  # Metadata log directory (stores KRaft metadata). Defaults to the first log directory.
  metadataLogDir: ""

# Service configuration.
service:
  # External port for client connections.
  externalPort: 9092
  # Internal (headless) port for inter-broker communication.
  internalPort: 9094
  # NodePort to expose Kafka outside the cluster. Set to 0 to disable.
  nodePort: 0

# Persistence configuration.
persistence:
  enabled: true
  # Storage size for Kafka log data.
  size: 50Gi
  # StorageClass name. Leave empty to use the default StorageClass.
  storageClass: ""
  annotations: {}
  accessModes:
    - ReadWriteOnce
  # Separate volume for KRaft metadata log. If disabled, metadata is stored on the data volume.
  kraftDedicated: false
  # Storage size for dedicated KRaft metadata volume.
  kraftSize: 10Gi

persistentVolumeClaimRetentionPolicy:
  enabled: false
  whenDeleted: Retain
  whenScaled: Retain

# Volume permissions init container (for fixing PVC ownership).
volumePermissions:
  enabled: false
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - FOWNER
        - DAC_OVERRIDE
    seccompProfile:
      type: RuntimeDefault

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

# Kafka JVM heap options.
# KAFKA_HEAP_OPTS overrides the default heap settings.
heapOpts: "-Xmx2G -Xms1G"

# Maximum message size in bytes that Kafka will accept.
# Sentry relay can produce large envelopes (3MB+), so default is 10MB.
maxMessageBytes: "10485760"

# Additional Kafka server.properties entries.
# Will be appended to the generated configuration.
extraServerProperties: {}

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

podAnnotations: {}
podLabels: {}

priorityClassName: ""

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

updateStrategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 60

# Kafka UI (Provectus) — optional web UI for browsing Kafka topics and messages.
kafkaUi:
  enabled: false
  replicas: 1
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  # Ingress configuration. Requires ingress.enabled=true.
  ingress:
    enabled: false
    className: nginx
    hostname: ""
    labels: {}
    annotations: {}
    tls: []
  # Gateway API (HTTPRoute). Requires gateway.enabled=true.
  # Ingress and gateway are mutually exclusive.
  gateway:
    enabled: false
    gatewayName: ""
    gatewayNamespace: ""
    hostname: ""

# Prometheus ServiceMonitor for automatic metric scraping.
serviceMonitor:
  enabled: false
  labels: {}
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

# NetworkPolicy restricts ingress/egress traffic to Kafka pods.
# When enabled, only the rules defined below are allowed;
# all other traffic is denied unless explicitly listed.
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress:
    - {}
  egress: []
