# Number of MySQL instances used when cluster.enabled is false.
replicaCount: 1

image:
  # Official MySQL 8.4 LTS image.
  repository: mysql
  tag: "8.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress:
    - {}
  egress: []

serviceMonitor:
  enabled: false
  labels: {}
  endpoints:
    - port: mysql
      interval: 30s
      path: /metrics

auth:
  # Auto-generated on first install when empty and preserved on upgrades.
  rootPassword: ""
  # Optional application database and user to create on first init.
  database: ""
  user: ""
  password: ""
  # Set this to use a pre-created Secret instead of rendering secret.yaml.
  # The Secret must contain keys MYSQL_ROOT_PASSWORD, and optionally
  # MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD.
  existingSecret: ""
  # Only used when cluster.enabled is true. Replicas connect to the primary
  # with this role for GTID-based replication.
  replicationUser: replicator
  # Auto-generated on first install when empty and preserved on upgrades.
  replicationPassword: ""

service:
  type: ClusterIP
  port: 3306
  annotations: {}

headlessService:
  annotations: {}

cluster:
  # Standalone mode stays the default. Enable this for one primary
  # StatefulSet plus one replica StatefulSet with GTID-based replication.
  enabled: false
  # Total MySQL pods when cluster.enabled is true. One pod is primary;
  # replicas - 1 pods are replicas.
  replicas: 3

mysql:
  # Extra mysqld configuration appended to standalone, primary, and replica pods.
  extraConfiguration: ""
  # Extra mysqld configuration appended only to the primary pod in cluster mode.
  primaryExtraConfiguration: ""
  # Extra mysqld configuration appended only to replica pods in cluster mode.
  replicaExtraConfiguration: ""

persistence:
  enabled: true
  size: 8Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}

persistentVolumeClaimRetentionPolicy:
  enabled: false
  whenDeleted: Retain
  whenScaled: Retain

volumePermissions:
  enabled: true
  image:
    repository: mysql
    tag: "8.4"
    pullPolicy: IfNotPresent
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - FOWNER
    seccompProfile:
      type: RuntimeDefault

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 999

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

updateStrategy:
  type: RollingUpdate

terminationGracePeriodSeconds: 30
