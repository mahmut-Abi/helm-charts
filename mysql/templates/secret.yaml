{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "mysql.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preserveRootPassword := and (not .Values.auth.rootPassword) $existing (hasKey $existing.data "MYSQL_ROOT_PASSWORD") }}
{{- $preserveUserPassword := and .Values.auth.user (not .Values.auth.password) $existing (hasKey $existing.data "MYSQL_PASSWORD") }}
{{- $preserveReplicationPassword := and .Values.cluster.enabled (not .Values.auth.replicationPassword) $existing (hasKey $existing.data "MYSQL_REPLICATION_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
type: Opaque
{{- if or $preserveRootPassword $preserveUserPassword $preserveReplicationPassword }}
data:
  {{- if $preserveRootPassword }}
  MYSQL_ROOT_PASSWORD: {{ index $existing.data "MYSQL_ROOT_PASSWORD" }}
  {{- end }}
  {{- if $preserveUserPassword }}
  MYSQL_PASSWORD: {{ index $existing.data "MYSQL_PASSWORD" }}
  {{- end }}
  {{- if $preserveReplicationPassword }}
  MYSQL_REPLICATION_PASSWORD: {{ index $existing.data "MYSQL_REPLICATION_PASSWORD" }}
  {{- end }}
{{- end }}
stringData:
  {{- if .Values.auth.rootPassword }}
  MYSQL_ROOT_PASSWORD: {{ .Values.auth.rootPassword | quote }}
  {{- else if not $preserveRootPassword }}
  MYSQL_ROOT_PASSWORD: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.auth.database }}
  MYSQL_DATABASE: {{ .Values.auth.database | quote }}
  {{- end }}
  {{- if .Values.auth.user }}
  MYSQL_USER: {{ .Values.auth.user | quote }}
  {{- if .Values.auth.password }}
  MYSQL_PASSWORD: {{ .Values.auth.password | quote }}
  {{- else if not $preserveUserPassword }}
  MYSQL_PASSWORD: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.cluster.enabled }}
  MYSQL_REPLICATION_USER: {{ .Values.auth.replicationUser | quote }}
  {{- if .Values.auth.replicationPassword }}
  MYSQL_REPLICATION_PASSWORD: {{ .Values.auth.replicationPassword | quote }}
  {{- else if not $preserveReplicationPassword }}
  MYSQL_REPLICATION_PASSWORD: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- end }}
{{- end }}
