{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "mongodb.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preserveRootPassword := and (not .Values.auth.rootPassword) $existing (hasKey $existing.data "MONGO_INITDB_ROOT_PASSWORD") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
{{- if $preserveRootPassword }}
data:
  MONGO_INITDB_ROOT_PASSWORD: {{ index $existing.data "MONGO_INITDB_ROOT_PASSWORD" }}
{{- end }}
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ required "auth.rootUser is required" .Values.auth.rootUser | quote }}
  {{- if .Values.auth.rootPassword }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.auth.rootPassword | quote }}
  {{- else if not $preserveRootPassword }}
  MONGO_INITDB_ROOT_PASSWORD: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{- if .Values.auth.database }}
  MONGO_INITDB_DATABASE: {{ .Values.auth.database | quote }}
  {{- end }}
{{- end }}
