{{- include "clickhouse.validateValues" . }}
{{- $metrics := default dict (get .Values "metrics") -}}
{{- $metricsEnabled := get $metrics "enabled" | default false -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse.fullname" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  replicas: {{ include "clickhouse.replicaCount" . }}
  podManagementPolicy: {{ include "clickhouse.podManagementPolicy" . }}
  serviceName: {{ include "clickhouse.headlessServiceName" . }}
  {{- if and .Values.persistence.enabled .Values.persistentVolumeClaimRetentionPolicy.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistentVolumeClaimRetentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.persistentVolumeClaimRetentionPolicy.whenScaled }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "clickhouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clickhouse.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "clickhouse.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        - name: copy-users-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
          args:
            - cp /config/users.xml /users-d/helm.xml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: clickhouse-users-d
              mountPath: /users-d
        {{- if .Values.volumePermissions.enabled }}
        - name: volume-permissions
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              chown -R {{ .Values.containerSecurityContext.runAsUser }}:{{ .Values.containerSecurityContext.runAsGroup }} /var/lib/clickhouse
              chmod 750 /var/lib/clickhouse
          securityContext:
            {{- toYaml .Values.volumePermissions.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
        {{- end }}
        {{- if .Values.cluster.enabled }}
        - name: generate-cluster-config
          image: "{{ .Values.cluster.configGeneratorImage.repository }}:{{ .Values.cluster.configGeneratorImage.tag }}"
          imagePullPolicy: {{ .Values.cluster.configGeneratorImage.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -ec
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              replicas_per_shard={{ int .Values.cluster.replicasPerShard }}
              shard=$((ordinal / replicas_per_shard + 1))
              replica=$((ordinal % replicas_per_shard + 1))

              mkdir -p /generated
              cat > /generated/cluster.xml <<EOF
              <clickhouse>
                <macros>
                  <cluster>{{ .Values.cluster.name }}</cluster>
                  <shard>${shard}</shard>
                  <replica>${replica}</replica>
                </macros>
              </clickhouse>
              EOF
          volumeMounts:
            - name: generated-config
              mountPath: /generated
        {{- end }}
      containers:
        - name: clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "clickhouse.secretName" . }}
                  key: {{ .Values.auth.secretKeys.user }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clickhouse.secretName" . }}
                  key: {{ .Values.auth.secretKeys.password }}
            - name: CLICKHOUSE_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "clickhouse.secretName" . }}
                  key: {{ .Values.auth.secretKeys.database }}
            {{- if .Values.cluster.enabled }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_FQDN
              value: "$(POD_NAME).{{ include "clickhouse.headlessServiceName" . }}.$(POD_NAMESPACE).svc.{{ .Values.cluster.clusterDomain }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: native
              containerPort: {{ .Values.service.nativePort }}
              protocol: TCP
            {{- if $metricsEnabled }}
            - name: metrics
              containerPort: {{ get $metrics "port" | default 9363 }}
              protocol: TCP
            {{- end }}
            {{- if .Values.cluster.enabled }}
            - name: interserver
              containerPort: {{ .Values.service.interserverHttpPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - unset CLICKHOUSE_DB && clickhouse-client --database default --query 'SELECT 1'
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: tmp
              mountPath: /tmp
            - name: clickhouse-log
              mountPath: /var/log/clickhouse-server
            - name: clickhouse-run
              mountPath: /var/run/clickhouse-server
            - name: config
              mountPath: /etc/clickhouse-server/config.d/helm.xml
              subPath: config.xml
            - name: clickhouse-users-d
              mountPath: /etc/clickhouse-server/users.d
            {{- if .Values.cluster.enabled }}
            - name: generated-config
              mountPath: /etc/clickhouse-server/config.d/generated-cluster.xml
              subPath: cluster.xml
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: clickhouse-log
          emptyDir: {}
        - name: clickhouse-run
          emptyDir: {}
        - name: clickhouse-users-d
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "clickhouse.fullname" . }}
        {{- if .Values.cluster.enabled }}
        - name: generated-config
          emptyDir: {}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "clickhouse.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "clickhouse.labels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ ternary "" .Values.persistence.storageClass (eq .Values.persistence.storageClass "-") | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
