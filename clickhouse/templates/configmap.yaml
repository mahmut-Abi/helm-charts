{{- include "clickhouse.validateValues" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
data:
  config.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
      <http_port>{{ .Values.service.httpPort }}</http_port>
      <tcp_port>{{ .Values.service.nativePort }}</tcp_port>
      <path>/var/lib/clickhouse/</path>
      <tmp_path>/var/lib/clickhouse/tmp/</tmp_path>
      <user_files_path>/var/lib/clickhouse/user_files/</user_files_path>
      <format_schema_path>/var/lib/clickhouse/format_schemas/</format_schema_path>

      <!-- Production safety: prevent accidental DROP of large tables -->
      <max_table_size_to_drop>0</max_table_size_to_drop>
      <max_partition_size_to_drop>0</max_partition_size_to_drop>

      <!-- Production concurrency: prevent overload -->
      <max_connections>4096</max_connections>
      <max_concurrent_queries>100</max_concurrent_queries>

      <!-- Limit total server memory (~90% of pod limit) -->
      <max_server_memory_usage_to_ram_ratio>0.9</max_server_memory_usage_to_ram_ratio>

      <!-- Cache for index mark files -->
      <mark_cache_size>4294967296</mark_cache_size>

      <!-- Enable async inserts for high-throughput ingestion -->
      <async_insert>1</async_insert>
      <wait_for_async_insert>0</wait_for_async_insert>

      <logger>
        <level>information</level>
        <console>true</console>
      </logger>
      {{- if .Values.cluster.enabled }}
      <interserver_http_port>{{ .Values.service.interserverHttpPort }}</interserver_http_port>
      <interserver_http_host from_env="POD_FQDN"/>
      <remote_servers>
        <{{ .Values.cluster.name }}>
          {{- $shards := int .Values.cluster.shards }}
          {{- $replicasPerShard := int .Values.cluster.replicasPerShard }}
          {{- range $shardIndex := until $shards }}
          <shard>
            <internal_replication>{{ $.Values.cluster.internalReplication }}</internal_replication>
            {{- range $replicaIndex := until $replicasPerShard }}
            {{- $ordinal := add (mul $shardIndex $replicasPerShard) $replicaIndex }}
            <replica>
              <host>{{ printf "%s-%d.%s.%s.svc.%s" (include "clickhouse.fullname" $) $ordinal (include "clickhouse.headlessServiceName" $) $.Release.Namespace $.Values.cluster.clusterDomain }}</host>
              <port>{{ $.Values.service.nativePort }}</port>
              <user from_env="CLICKHOUSE_USER"/>
              <password from_env="CLICKHOUSE_PASSWORD"/>
            </replica>
            {{- end }}
          </shard>
          {{- end }}
        </{{ .Values.cluster.name }}>
      </remote_servers>
      <distributed_ddl>
        <path>{{ .Values.cluster.distributedDdl.path }}</path>
      </distributed_ddl>
      <default_replica_path>{{ .Values.cluster.defaultReplicaPath }}</default_replica_path>
      <default_replica_name>{{ .Values.cluster.defaultReplicaName }}</default_replica_name>
      {{- if .Values.keeper.enabled }}
      <zookeeper>
        {{- range $keeperIndex := until (int .Values.keeper.replicas) }}
        <node index="{{ add $keeperIndex 1 }}">
          <host>{{ printf "%s-%d.%s.%s.svc.%s" (include "clickhouse.keeperFullname" $) $keeperIndex (include "clickhouse.keeperHeadlessServiceName" $) $.Release.Namespace $.Values.cluster.clusterDomain }}</host>
          <port>{{ $.Values.keeper.clientPort }}</port>
        </node>
        {{- end }}
      </zookeeper>
      {{- end }}
      {{- end }}
    </clickhouse>
  users.xml: |
    <clickhouse>
      <profiles>
        <default>
          <!-- ~80% of pod memory limit for safety -->
          <max_memory_usage>32000000000</max_memory_usage>
          <use_uncompressed_cache>0</use_uncompressed_cache>
          <load_balancing>random</load_balancing>
        </default>
        <!-- Read-only profile for query-heavy workloads -->
        <readonly>
          <readonly>1</readonly>
          <max_memory_usage>32000000000</max_memory_usage>
        </readonly>
      </profiles>
      <quotas>
        <default>
          <interval>
            <duration>3600</duration>
            <queries>0</queries>
            <errors>0</errors>
            <result_rows>0</result_rows>
            <read_rows>0</read_rows>
            <execution_time>0</execution_time>
          </interval>
        </default>
      </quotas>
    </clickhouse>
