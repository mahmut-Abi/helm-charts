{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.secretName" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeys.user }}: {{ .Values.auth.user | quote }}
  {{ .Values.auth.secretKeys.password }}: {{ .Values.auth.password | quote }}
  {{ .Values.auth.secretKeys.database }}: {{ .Values.auth.database | quote }}
{{- end }}
