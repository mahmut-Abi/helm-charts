{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "clickhouse.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $preservePassword := and (not .Values.auth.password) $existing (hasKey $existing.data .Values.auth.secretKeys.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
type: Opaque
{{- if $preservePassword }}
data:
  {{ .Values.auth.secretKeys.password }}: {{ index $existing.data .Values.auth.secretKeys.password }}
{{- end }}
stringData:
  {{ .Values.auth.secretKeys.user }}: {{ .Values.auth.user | quote }}
  {{- if .Values.auth.password }}
  {{ .Values.auth.secretKeys.password }}: {{ .Values.auth.password | quote }}
  {{- else if not $preservePassword }}
  {{ .Values.auth.secretKeys.password }}: {{ randAlphaNum 32 | quote }}
  {{- end }}
  {{ .Values.auth.secretKeys.database }}: {{ .Values.auth.database | quote }}
{{- end }}
