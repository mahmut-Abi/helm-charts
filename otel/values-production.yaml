# High-load production example. Replace backend endpoints and Secret names before use.
replicaCount: 3

serviceAccount:
  create: true
  automountServiceAccountToken: false

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    prometheus:
      config:
        scrape_configs:
          - job_name: "otel-collector"
            scrape_interval: 15s
            static_configs:
              - targets:
                  - "localhost:8888"
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 3072
      spike_limit_mib: 512
    batch:
      send_batch_size: 5000
      send_batch_max_size: 10000
      timeout: 5s
  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
      sending_queue:
        enabled: true
        num_consumers: 8
        queue_size: 20000
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 30s
        max_elapsed_time: 300s
    prometheus:
      endpoint: "0.0.0.0:8889"
  extensions:
    health_check:
      endpoint: "0.0.0.0:13133"
    pprof:
      endpoint: "localhost:1777"
  service:
    extensions:
      - health_check
      - pprof
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp/tempo
      metrics:
        receivers:
          - otlp
          - prometheus
        processors:
          - memory_limiter
          - batch
        exporters:
          - prometheus

resources:
  requests:
    cpu: 2
    memory: 4Gi
  limits:
    cpu: 4
    memory: 4Gi

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

serviceMonitor:
  enabled: true
  labels:
    release: prometheus

networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  # Replace allow-all with precise telemetry producer and backend selectors in production.
  ingress:
    - {}
  egress:
    - {}

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: otel

extraEnvFrom:
  - secretRef:
      name: otel-exporter-credentials
