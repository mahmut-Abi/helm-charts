# Default values for the OpenTelemetry Collector Helm chart.

# Number of collector replicas.
replicaCount: 1

image:
  # OpenTelemetry Collector image repository.
  repository: otel/opentelemetry-collector-contrib
  # Pin to a stable tag. Override when you need a specific version.
  tag: "0.153.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# OpenTelemetry Collector configuration.
# This generates the collector YAML config (receivers, processors, exporters, pipelines).
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    prometheus:
      config:
        scrape_configs:
          - job_name: "otel-collector"
            scrape_interval: 15s
            static_configs:
              - targets:
                  - "localhost:8888"
  processors:
    batch:
      send_batch_size: 1000
      timeout: 10s
      send_batch_max_size: 2000
    memory_limiter:
      check_interval: 1s
      limit_mib: 512
      spike_limit_mib: 128
  exporters:
    debug:
      verbosity: basic
    prometheus:
      endpoint: "0.0.0.0:8889"
  extensions:
    health_check:
      endpoint: "0.0.0.0:13133"
    pprof:
      endpoint: "localhost:1777"
  service:
    extensions:
      - health_check
      - pprof
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
      metrics:
        receivers:
          - otlp
          - prometheus
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - prometheus
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug

# Service configuration.
service:
  type: ClusterIP
  # OTLP gRPC port.
  otlpGrpcPort: 4317
  # OTLP HTTP port.
  otlpHttpPort: 4318
  # Own metrics port (Prometheus scrape endpoint).
  metricsPort: 8888
  # Prometheus exporter port.
  prometheusExportPort: 8889
  # Health check extension port.
  healthCheckPort: 13133
  annotations: {}

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: false
  # Set explicit ingress rules in production so only instrumented workloads can send telemetry.
  ingress: []
  # Set explicit egress rules in production when exporters target known backends.
  egress: []
  policyTypes:
    - Ingress
    - Egress

serviceMonitor:
  enabled: true
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  endpoints:
    - port: metrics
      path: /metrics
    - port: prom-exp
      path: /metrics

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  enabled: true
  path: /
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

terminationGracePeriodSeconds: 30

# Additional command-line arguments for the collector.
extraArgs: []
#  - --feature-gates=receiver.otlp.retry_on_failure

# Additional environment variables.
extraEnv: []
#  - name: OTEL_RESOURCE_ATTRIBUTES
#    value: "service.name=otel-collector"

# Additional environment variable sources, typically Secrets with exporter credentials.
extraEnvFrom: []
#  - secretRef:
#      name: otel-exporter-credentials

revisionHistoryLimit: 10
