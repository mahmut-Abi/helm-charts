apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel.fullname" . }}
  labels:
    {{- include "otel.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.service.otlpGrpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.service.otlpHttpPort }}
      targetPort: otlp-http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
    - name: prom-exp
      port: {{ .Values.service.prometheusExportPort }}
      targetPort: prom-exp
      protocol: TCP
    - name: health-check
      port: {{ .Values.service.healthCheckPort }}
      targetPort: health-check
      protocol: TCP
  selector:
    {{- include "otel.selectorLabels" . | nindent 4 }}